[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

# Explicitly local-only. Do not add Atlantic or mainnet RPC endpoints here.
[rpc_endpoints]
local = "http://127.0.0.1:8545"
